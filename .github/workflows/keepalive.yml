name: Keepalive Commit

on:
  schedule:
    - cron: '0 3 1 * *'   # 매달 1일 UTC 03:00 (베트남 시간 10:00) 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keepalive empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive commit (60일 자동 비활성화 방지)"
          git push
